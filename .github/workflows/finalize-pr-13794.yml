name: Finalize PR 13794

on:
  push:
    branches:
      - automation/pr13794-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: draft/ui-vpc-tier-acl
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Apply and verify the final follow-up
        env:
          PATCH_GZIP_BASE64: 
          EXPECTED_PARENT: abdded0988b85c853da69b1d9db41a8ef490b99b
          EXPECTED_COMPONENT_BLOB: d6b4f0c29b9d573623ab36a1a69df0090bddfda4
          EXPECTED_TEST_BLOB: 56073fa32e8798947d3d6408a280458f40cdaf97
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/pr13794-final.patch
          git apply --check /tmp/pr13794-final.patch
          git apply --index /tmp/pr13794-final.patch
          git diff --cached --check
          test "$(git diff --cached --name-only)" = $'ui/src/views/network/VpcTiersTab.vue\nui/tests/unit/views/network/VpcTiersTab.spec.js'
          test "$(git hash-object ui/src/views/network/VpcTiersTab.vue)" = "$EXPECTED_COMPONENT_BLOB"
          test "$(git hash-object ui/tests/unit/views/network/VpcTiersTab.spec.js)" = "$EXPECTED_TEST_BLOB"
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ui/src/views/network/VpcTiersTab.vue').read_text()
          script = source.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/VpcTiersTab.mjs').write_text(script)
          PYCODE
          node --check /tmp/VpcTiersTab.mjs
          node --check ui/tests/unit/views/network/VpcTiersTab.spec.js
          cd ui
          npm install
          npx eslint src/views/network/VpcTiersTab.vue tests/unit/views/network/VpcTiersTab.spec.js
          npm run test:unit -- --runTestsByPath tests/unit/views/network/VpcTiersTab.spec.js --runInBand
          cd ..
          git config user.name Dogface2k
          git config user.email 100990646+Dogface2k@users.noreply.github.com
          git commit -m 'UI: preserve VPC tier ACL replacement lifecycle'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git push origin HEAD:refs/heads/draft/ui-vpc-tier-acl

      - name: Remove the temporary helper branch
        if: always()
        shell: bash
        run: |
          git push origin --delete automation/pr13794-finalize || true
